name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and verify released inputs
        run: |
          python3 scripts/prepare_data.py
          python3 scripts/check_release_consistency.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Fixed-query integration test
        run: python3 tests/test_fixed_query_interface.py build/route_search build/kcrn_bl

